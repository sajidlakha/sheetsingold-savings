:root{--onacc:#1B2A41;--bg:#0E1624;--bg2:#131E30;--card:#172438;--card2:#1D2C44;--line:#2A3A55;--text:#EDE6D6;--muted:#98A3B5;--gold:#D6B563;--gold2:#B8913F;--goldbg:rgba(214,181,99,.13);
 --green:#6FBF8E;--greenbg:rgba(111,191,142,.14);--red:#E58A74;--redbg:rgba(229,138,116,.14);--blue:#7FA7D9;--shadow:0 10px 30px rgba(0,0,0,.35);--r:18px}
[data-theme=rose]{--onacc:#fff;--bg:#FBF3F1;--bg2:#F6E7E3;--card:#FFFFFF;--card2:#FDF7F5;--line:#EFD9D3;--text:#4A1F2C;--muted:#8A6F74;--gold:#B86B5A;--gold2:#9C5646;--goldbg:rgba(184,107,90,.12);
 --green:#3F7F5E;--greenbg:#E2F0E7;--red:#B8434A;--redbg:#F8DEDF;--blue:#6A5A9E;--shadow:0 10px 28px rgba(74,31,44,.08)}
[data-theme=sage]{--onacc:#fff;--bg:#F1F4EE;--bg2:#E5EBE1;--card:#FFFFFF;--card2:#F7F9F4;--line:#D9E3D4;--text:#1F3A33;--muted:#687A71;--gold:#4E8B6E;--gold2:#3D7359;--goldbg:rgba(78,139,110,.12);
 --green:#2F7D55;--greenbg:#E1F0E6;--red:#B5523B;--redbg:#F6E0D8;--blue:#3D6E8C;--shadow:0 10px 28px rgba(31,58,51,.08)}
[data-theme=lavender]{--onacc:#fff;--bg:#F5F2FB;--bg2:#ECE6F8;--card:#FFFFFF;--card2:#FAF8FE;--line:#E3DCF2;--text:#2E2750;--muted:#77719A;--gold:#7C63C9;--gold2:#6550AE;--goldbg:rgba(124,99,201,.12);
 --green:#3B8C69;--greenbg:#E1F2EA;--red:#C24E67;--redbg:#F9E0E6;--blue:#4F7CC9;--shadow:0 10px 28px rgba(46,39,80,.09)}
[data-theme=ocean]{--onacc:#07262B;--bg:#08171C;--bg2:#0C2128;--card:#102C35;--card2:#153641;--line:#224A56;--text:#E2F1F1;--muted:#8DB0B4;--gold:#5CC6BE;--gold2:#3FA9A1;--goldbg:rgba(92,198,190,.13);
 --green:#7DD3A1;--greenbg:rgba(125,211,161,.14);--red:#F29078;--redbg:rgba(242,144,120,.14);--blue:#8FB8F0;--shadow:0 10px 30px rgba(0,0,0,.38)}
[data-theme=ivory]{--onacc:#fff;--bg:#F6F1E6;--bg2:#EFE7D6;--card:#FFFFFF;--card2:#FBF7EF;--line:#E6DCC6;--text:#1B2A41;--muted:#6E7482;--gold:#B8913F;--gold2:#9C7A31;--goldbg:rgba(184,145,63,.12);
 --green:#2F7D55;--greenbg:#E3F1E8;--red:#B5523B;--redbg:#F8E2DA;--blue:#2E5E9E;--shadow:0 10px 28px rgba(27,42,65,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Playfair Display',Georgia,serif}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:0 0 232px;background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A3F60,#0E1624);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-weight:700;font-size:20px}
.brand b{display:block;font-size:14px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--card)}.nav.on{background:var(--goldbg);color:var(--gold)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.side .grow{flex:1}
.side .log{margin-top:8px;background:var(--gold);color:var(--onacc);border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 110px;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:30px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onacc)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.red{color:var(--red)}
.grid{display:grid;gap:18px}.grid>*,.inl>*{min-width:0}html,body{overflow-x:hidden}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .btn{letter-spacing:0;text-transform:none}
.hero{background:linear-gradient(145deg,var(--card2),var(--card));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--goldbg),transparent 70%)}
.label{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.big{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:64px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.5px}
.big .cur{font-size:.5em;vertical-align:.65em;margin-right:3px;color:var(--muted)}
.big.neg{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.gold-t{color:var(--gold)}.green-t{color:var(--green)}.red-t{color:var(--red)}
.link{color:var(--gold);cursor:pointer;font-weight:700;background:none;border:0;padding:0;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--gold)}
.bar.green i{background:var(--green)}.bar.red i{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .nm{font-weight:700;font-size:14px}.row .meta{color:var(--muted);font-size:12px;margin-top:2px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.gold{background:var(--goldbg);color:var(--gold)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.grey{background:var(--line);color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qa{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.qa:hover,.qa.on{border-color:var(--gold);color:var(--gold)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--gold)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:block}
.inl{display:flex;gap:10px}.inl>*{flex:1}
.envs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.env{border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;background:none}
.env.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.next{display:flex;gap:14px;align-items:center;background:var(--goldbg);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.next .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 34px}
.kpi .v{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;margin-top:4px}
.kpi .k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--muted)}
/* forecast */
.fc{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:6px}
.fc .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.fc .cw{flex:1;width:100%;display:flex;align-items:flex-end}
.fc .col{width:100%;border-radius:6px 6px 3px 3px;background:var(--goldbg);border:1px solid var(--gold);position:relative}
.fc .col.bill{background:var(--redbg);border-color:var(--red)}
.fc .col.pay{background:var(--greenbg);border-color:var(--green)}
.fc .dl{font-size:10px;color:var(--muted);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:1px;padding:4px 0}
.cal .c{min-height:92px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .c.out{opacity:.35}.cal .c.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal .c .dn{font-weight:800;font-size:13px}
.cal .c.pay{background:linear-gradient(180deg,var(--goldbg),var(--card2))}
.cal .ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.p{background:var(--gold);color:var(--onacc)}.ev.b{background:var(--redbg);color:var(--red)}.ev.b.paid{background:var(--greenbg);color:var(--green)}.ev.s{color:var(--muted);background:none;padding:0 5px}
/* ring */
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 74px}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(5,10,18,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.modal h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin-bottom:4px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}.toast button{background:none;border:0;color:var(--gold2);font-weight:800;cursor:pointer}
/* mobile nav */

const pad = n => String(n).padStart(2,'0');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- lock + encryption (PBKDF2 + AES-GCM) ---------- */
let lockInfo = (() => { try { const o = JSON.parse(localStorage.getItem(LOCK)); if (o && o.locked && o.salt) return o; } catch(e){} return {locked:false}; })();
const saveLock = () => { try { localStorage.setItem(LOCK, JSON.stringify(lockInfo)); } catch(e){} };
let cryptoKey = null;
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(salt), iterations:210000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptText(text, key, salt){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text)); return JSON.stringify({enc:1, kind:'sig-savings', salt, iv:b64(iv), ct:b64(ct)}); }
async function decryptText(blob, key){ const o = typeof blob === 'string' ? JSON.parse(blob) : blob; const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct)); return new TextDecoder().decode(pt); }
const isEncrypted = raw => { try { const o = JSON.parse(raw); return !!(o && o.enc === 1 && o.ct); } catch(e){ return false; } };

/* ---------- state ---------- */
function blank(){
  return {v:1, kind:'sig-savings', name:'', cur:'$', theme:'midnight', start:TODAY(), setupDone:false, example:false,
    challenges:[], goals:[], funds:[], deposits:[], wins:[], miles:[],
    emergency:{costs:[], months:6, goalId:''},
    profile:{size:'md', contrast:false, privacy:false, calm:false}, lastOpen:TODAY()};
}
function clean(d){
  const o = Object.assign(blank(), d && typeof d === 'object' ? d : {});
  ['challenges','goals','funds','deposits','wins','miles'].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  o.profile = Object.assign(blank().profile, o.profile && typeof o.profile === 'object' ? o.profile : {});
  if (!['md','lg','xl'].includes(o.profile.size)) o.profile.size = 'md';
  if (!CURS.includes(o.cur)) o.cur = '$';
  if (!THEMES.some(t => t[0] === o.theme)) o.theme = 'midnight';
  if (!isDate(o.start)) o.start = TODAY();
  o.name = String(o.name || '').slice(0, 40);
  o.challenges = o.challenges.filter(c => c && TYPES[c.type]).map(c => {
    c.id = String(c.id || uid()); c.name = String(c.name || TYPES[c.type].name).slice(0, 60);
    if (!isDate(c.start)) c.start = TODAY(); c.base = Math.max(0, +c.base || 0); c.count = Math.max(1, Math.min(400, Math.round(+c.count || TYPES[c.type].n)));
    if (!['up','down','same'].includes(c.style)) c.style = 'up'; c.every = [0,1,7,14,30].includes(+c.every) ? +c.every : 7; c.moved = Math.max(0, +c.moved || 0);
    const t = {}; if (c.ticks && typeof c.ticks === 'object') Object.keys(c.ticks).forEach(k => { const i = +k; if (i >= 0 && i < 400 && isDate(c.ticks[k])) t[i] = c.ticks[k]; }); c.ticks = t;
    c.goalId = String(c.goalId || ''); return c; });
  o.goals = o.goals.filter(g => g && g.id).map(g => Object.assign(g, {id:String(g.id), name:String(g.name||'Goal').slice(0,60), target:Math.max(0,+g.target||0), saved0:+g.saved0||0, monthly:Math.max(0,+g.monthly||0), date:isDate(g.date)?g.date:'', emo:safeEmo(g.emo)}));
  o.funds = o.funds.filter(f => f && f.id).map(f => Object.assign(f, {id:String(f.id), emo:safeEmo(f.emo), name:String(f.name||'Fund').slice(0,60), cost:Math.max(0,+f.cost||0), saved0:+f.saved0||0, every:[0,1,3,6,12,24].includes(+f.every)?+f.every:12, due:isDate(f.due)?f.due:TODAY()}));
  o.deposits = o.deposits.filter(x => x && isDate(x.date) && isFinite(+x.amount)).map(x => Object.assign(x, {id:String(x.id||uid()), amount:r2(+x.amount), to:String(x.to||''), note:String(x.note||'').slice(0,80)}));
  const e = o.emergency && typeof o.emergency === 'object' ? o.emergency : {}; o.emergency = {costs:Array.isArray(e.costs) ? e.costs.filter(c => c && c.id).map(c => ({id:c.id, n:String(c.n||'').slice(0,40), v:Math.max(0,+c.v||0)})) : [], months:[1,3,6,9,12].includes(+e.months) ? +e.months : 6, goalId:String(e.goalId||'')};
  const B = {}; if (o.badges && typeof o.badges === 'object') Object.keys(o.badges).forEach(k => { if (/^[a-z0-9]{2,8}$/.test(k) && isDate(o.badges[k])) B[k] = o.badges[k]; }); o.badges = B;
  o.drew = !!o.drew; o.caught = !!o.caught;
  return o;
}
/* only emojis from our own lists can be stored (they are shown without escaping) */
function safeEmo(e){ if (!e) return ''; const ok = new Set(GEMO.concat(['🎂','📺','🛡️','🔧','🗓️','🧾','🛒','💡','🚌'])); return ok.has(e) ? e : ''; }
function load(){ try { const raw = localStorage.getItem(KEY); if (!raw || isEncrypted(raw)) return null; const s = JSON.parse(raw); if (s && s.v) return clean(s); } catch(e){} return null; }
let S = null, saveSeq = 0;
function save(quiet){
  if (!S) return; const data = JSON.stringify(S);
  const fail = () => toast('Could not save on this device. Download a backup in Settings.');
  if (lockInfo.locked) { if (!cryptoKey) return; const seq = ++saveSeq, key = cryptoKey;
    encryptText(data, key, lockInfo.salt).then(blob => { if (seq !== saveSeq) return; try { localStorage.setItem(KEY, blob); } catch(e){ fail(); } }); }
  else { try { localStorage.setItem(KEY, data); } catch(e){ fail(); } }
  if (!quiet) autoBackupSoon();
}
const money = (n, dp) => { const neg = n < 0; n = Math.abs(+n || 0); const whole = Math.abs(n - Math.round(n)) < .005;
  const f = (dp === 0 || (dp === undefined && (n >= 1000 || whole))) ? Math.round(n).toLocaleString() : n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?'-':'')+S.cur+f; };

/* ---------- challenges ---------- */
const TYPES = {
  w52:   {name:'52-Week Challenge', short:'52-week', n:52, every:7, base:1, unit:'Week', icon:'calendar', styles:true,
          desc:'Save a little more each week for a year. Week 1 you save 1, week 2 you save 2, and so on up to 52.'},
  p26:   {name:'26-Paycheck Challenge', short:'26-paycheck', n:26, every:14, base:1, unit:'Payday', icon:'wallet', styles:true,
          desc:'Like the 52-week challenge, but you save once every payday (every 2 weeks).'},
  env:   {name:'100 Envelope Challenge', short:'Envelopes', n:100, every:0, base:1, unit:'Envelope', icon:'envelope',
          desc:'100 envelopes numbered 1 to 100. Pick one, save that amount and it is filled. Any order you like.'},
  penny: {name:'365-Day Penny Challenge', short:'Penny', n:365, every:1, base:0.01, unit:'Day', icon:'coin', styles:true,
          desc:'Save 1 cent on day 1, 2 cents on day 2, and so on for a year. Tiny steps that grow.'},
  nospend:{name:'No-Spend Challenge', short:'No-spend', n:30, every:1, base:0, unit:'Day', icon:'leaf', noMoney:true,
          desc:'Pick some days where you only buy what you really need. Tick each day you do it.'},
  custom:{name:'My own challenge', short:'Custom', n:12, every:30, base:50, unit:'Step', icon:'spark', styles:true, custom:true,
          desc:'Make your own: how many boxes, how often and how much. For example 50 every month for a year.'}
};
const EVERY = [[1,'Every day'],[7,'Every week'],[14,'Every 2 weeks'],[30,'Every month'],[0,'Any order, any time']];
function amountOf(c, i){
  const b = c.base, n = c.count;
  switch (c.type) {
    case 'w52': return r2(c.style === 'down' ? b*(n-i) : c.style === 'same' ? b : b*(i+1));
    case 'p26': return r2(c.style === 'down' ? b*(4*(n-i)-1) : c.style === 'same' ? b : b*(4*(i+1)-1));
    case 'env': return r2(b*(i+1));
    case 'penny': return r2(c.style === 'down' ? b*(n-i) : c.style === 'same' ? b : b*(i+1));
    case 'nospend': return 0;
    default: return r2(c.style === 'down' ? b*(n-i) : c.style === 'same' ? b : b*(i+1));
  }
}
const everyOf = c => c.type === 'custom' ? c.every : TYPES[c.type].every;
function dueOf(c, i){ const e = everyOf(c); if (!e) return null; return e === 30 ? addM(c.start, i) : addD(c.start, i*e); }
function boxes(c){ const out = []; for (let i = 0; i < c.count; i++) out.push({i, amt:amountOf(c,i), due:dueOf(c,i), done:c.ticks[i] || null}); return out; }
function stats(c){
  const B = boxes(c), t = TODAY(); let saved = 0, total = 0, doneN = 0; const missed = [], dueNow = [];
  B.forEach(b => { total += b.amt; if (b.done) { saved += b.amt; doneN++; } else if (b.due) { if (b.due < weekStart(t)) missed.push(b); else if (b.due <= addD(weekStart(t),6)) dueNow.push(b); } });
  const next = B.find(b => !b.done && b.due && b.due >= t) || B.find(b => !b.done) || null;
  const last = B.length && B[B.length-1].due, weeks = last ? Math.max(1, (diff(last, c.start) + everyOf(c)) / 7) : c.count / 7;
  return {B, saved:r2(saved), total:r2(total), doneN, n:B.length, pct: total ? saved/total : (B.length ? doneN/B.length : 0), missed, dueNow, next, complete: doneN === B.length, perWeek: total/weeks, biggest: Math.max(0, ...B.map(b => b.amt)), end:last};
}
const chLabel = (c, b) => c.type === 'nospend' || c.type === 'penny' ? (b.due ? short(b.due) : 'Day '+(b.i+1)) : TYPES[c.type].unit + ' ' + (b.i+1);

/* ---------- goals, funds, totals ---------- */
const depSum = to => S.deposits.filter(d => d.to === to).reduce((a,d) => a + d.amount, 0);
const chSaved = c => stats(c).saved;
function goalSaved(g){ return r2((+g.saved0||0) + depSum('g:'+g.id) + S.challenges.filter(c => c.goalId === g.id).reduce((a,c) => a + chSaved(c), 0)); }
function goalInfo(g){
  const saved = goalSaved(g), left = Math.max(0, g.target - saved), t = TODAY();
  const ml = g.date ? (g.date > t ? monthsLeft(g.date) : 0) : null, need = g.date ? (ml ? left / ml : left) : null;
  let status = 'grey', text = 'Add a target';
  if (g.target > 0) { if (saved >= g.target) { status = 'green'; text = '🎉 Reached'; }
    else if (!g.date) { status = 'grey'; text = 'No date yet'; }
    else if (!ml) { status = 'red'; text = 'Date passed'; }
    else if ((+g.monthly||0) >= need - .005) { status = 'green'; text = '✓ On track'; }
    else { status = 'red'; text = 'Behind: +' + money(need - (+g.monthly||0), 0) + ' a month'; } }
  return {saved, left, ml, need, status, text, pct: g.target ? Math.min(1, saved/g.target) : 0};
}
function fundNext(f){ let d = f.due, t = TODAY(), k = 0; if (f.every) while (d < t && k++ < 400) d = addM(d, f.every); return d; }
function fundInfo(f){
  const saved = r2((+f.saved0||0) + depSum('f:'+f.id)), next = fundNext(f), ml = next > TODAY() ? monthsLeft(next) : 0, left = Math.max(0, f.cost - saved);
  const ready = f.cost > 0 && saved >= f.cost - .005, soon = !ready && diff(next, TODAY()) <= 30;
  return {saved, next, ml, left, perMonth: left / Math.max(1, ml), ready, soon, pct: f.cost ? Math.min(1, saved/f.cost) : 0};
}
function totals(){
  const ch = S.challenges.reduce((a,c) => a + chSaved(c), 0), dep = S.deposits.reduce((a,d) => a + d.amount, 0);
  const s0 = S.goals.reduce((a,g) => a + (+g.saved0||0), 0) + S.funds.reduce((a,f) => a + (+f.saved0||0), 0);
  const notMoved = S.challenges.filter(c => !TYPES[c.type].noMoney).reduce((a,c) => a + Math.max(0, chSaved(c) - (c.moved||0)), 0);
  return {all:r2(ch + dep + s0), ch:r2(ch), dep:r2(dep), notMoved:r2(notMoved)};
}
/* money saved per day from ticks + deposits (for charts and "this month") */
function flows(){ const m = {};
  S.challenges.forEach(c => { if (TYPES[c.type].noMoney) return; Object.keys(c.ticks).forEach(i => { const d = c.ticks[i]; m[d] = (m[d]||0) + amountOf(c, +i); }); });
  S.deposits.forEach(x => { if (x.amount > 0) m[x.date] = (m[x.date]||0) + x.amount; }); return m; }
function savedBetween(a, b){ const m = flows(); return r2(Object.keys(m).filter(d => d >= a && d <= b).reduce((s,d) => s + m[d], 0)); }
function weekStart(t = TODAY()){ const d = pd(t), wd = (d.getDay() + 6) % 7; return addD(t, -wd); }
function monthly12(){ const t = TODAY(), out = []; const y = pd(t).getFullYear(), m = pd(t).getMonth();
  for (let k = 11; k >= 0; k--) { const a = ds(new Date(y, m-k, 1, 12)), b = ds(new Date(y, m-k+1, 0, 12)); out.push({l:MON[pd(a).getMonth()], v:savedBetween(a, b)}); } return out; }
function weeksActive(n = 8){ const m = flows(), w = weekStart(); const out = [];
  for (let k = n-1; k >= 0; k--) { const a = addD(w, -7*k), b = addD(a, 6); out.push({a, on: Object.keys(m).some(d => d >= a && d <= b) || S.challenges.some(c => c.type === 'nospend' && Object.values(c.ticks).some(d => d >= a && d <= b))}); } return out; }

/* ---------- pick for me ---------- */
const NICE = [0.01,0.02,0.05,0.1,0.25,0.5,1,2,5,10,20,25,50,100];
const niceBase = x => NICE.reduce((b,v) => Math.abs(v - x) < Math.abs(b - x) ? v : b, NICE[0]);
function suggest(week){
  const W = Math.max(1, +week || 0), rows = [];
  const mk = (type, extra) => { const c = Object.assign({type, style:'up', start:TODAY(), ticks:{}, count:TYPES[type].n, every:TYPES[type].every}, extra); const s = stats(c); return {type, c, total:s.total, perWeek:s.perWeek, biggest:s.biggest, weeks:Math.round(s.n * (everyOf(c)||1) / 7)}; };
  rows.push(mk('w52', {base: niceBase(W / 26.5)}));
  rows.push(mk('p26', {base: niceBase(W * 2 / 53)}));
  rows.push(mk('env', {base: niceBase(W / 353.5), count:100}));   // one envelope a day: 5,050 x base over ~14 weeks
  rows.push(mk('penny', {base: niceBase(W / 7 / 183)}));
  rows.forEach(r => { r.fit = Math.abs(Math.log(Math.max(.01, r.perWeek) / W)); });
  return rows.sort((a,b) => a.fit - b.fit);
}

/* ---------- small charts (SVG, theme aware) ---------- */
const PAL = () => { const cs = getComputedStyle(document.documentElement); return [cs.getPropertyValue('--gold'), cs.getPropertyValue('--green'), cs.getPropertyValue('--blue'), cs.getPropertyValue('--red'), '#B89AE0', '#E0A96D', '#7FC4C0'].map(x => x.trim()); };
function donut(items, center, sub){
  const tot = items.reduce((a,x) => a + Math.max(0,x.v), 0); if (!tot) return '';
  const pal = PAL(); let a0 = -Math.PI/2; const R = 62, r = 42, cx = 75, cy = 75;
  const arcs = items.map((x,i) => { const f = Math.max(0,x.v)/tot; if (f <= 0) return ''; const a1 = a0 + f*Math.PI*2 - (f < 1 ? 0.012 : 0); const big = a1 - a0 > Math.PI ? 1 : 0;
    const P = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)]; const [x1,y1] = P(R,a0), [x2,y2] = P(R,a1), [x3,y3] = P(r,a1), [x4,y4] = P(r,a0); a0 += f*Math.PI*2;
    if (f >= .999) return `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${pal[i%pal.length]}" stroke-width="${R-r}"/>`;
    return `<path d="M${x1},${y1}A${R},${R} 0 ${big} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${big} 0 ${x4},${y4}Z" fill="${pal[i%pal.length]}"/>`; }).join('');
  return `<div class="donutwrap"><svg class="chart" viewBox="0 0 150 150" style="max-width:150px">${arcs}<text x="75" y="73" text-anchor="middle" style="font-size:17px;font-weight:800;fill:var(--text);font-family:'Playfair Display',Georgia,serif">${center}</text><text x="75" y="90" text-anchor="middle">${sub||''}</text></svg>
    <div class="legend" style="flex-direction:column;flex:1;min-width:150px">${items.map((x,i) => x.v > 0 ? `<span><i style="background:${pal[i%pal.length]}"></i>${x.e||''} ${esc(x.l)} <b style="margin-left:auto" class="amt">${money(x.v,0)}</b> <span class="muted tiny">${Math.round(x.v/tot*100)}%</span></span>` : '').join('')}</div></div>`;
}
function lineChart(series, opts = {}){
  const narrow = innerWidth < 700, W = narrow ? 380 : 640, H = narrow ? 170 : (opts.h || 200), P = {l:48, r:12, t:12, b:26};
  const all = series.flatMap(s => s.pts.map(p => p[1])); let mn = 0, mx = Math.max(...all, 1) * 1.08;
  const n = Math.max(...series.map(s => s.pts.length)) - 1 || 1;
  const X = i => P.l + i/n*(W-P.l-P.r), Y = v => P.t + (mx - v)/(mx - mn)*(H-P.t-P.b);
  const grid = [0,.5,1].map(f => { const v = mx*f/1.08; return `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${money(v,0)}</text>`; }).join('');
  const paths = series.map(s => { const d = s.pts.map((p,i) => (i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
    const area = s.fill ? `<path d="${d}L${X(s.pts[s.pts.length-1][0])},${Y(0)}L${X(s.pts[0][0])},${Y(0)}Z" fill="${s.c}" opacity=".13"/>` : '';
    return area + `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`; }).join('');
  const xl = (opts.labels||[]).map(([i,t]) => `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${t}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${paths}${xl}</svg>`;
}

  return `<svg class="jar" viewBox="0 0 120 150" aria-hidden="true"><defs><clipPath id="jc"><path d="M22 34 Q22 26 30 26 L90 26 Q98 26 98 34 L98 128 Q98 140 86 140 L34 140 Q22 140 22 128 Z"/></clipPath></defs>

function nextStep(){
  const act = S.challenges.filter(c => !stats(c).complete);
  const due = act.flatMap(c => stats(c).dueNow.map(b => ({c, b}))).filter(x => !TYPES[x.c.type].noMoney).sort((a,b) => a.b.due < b.b.due ? -1 : 1);
  if (due.length) { const {c,b} = due[0]; return {e:EMO[c.type], t:`Save ${money(b.amt)} for ${chLabel(c,b)}`, s:`${esc(c.name)} · ${b.due === TODAY() ? 'due today' : 'this week, by '+nice(addD(weekStart(),6))}`, btn:`<button class="btn gold" data-act="tick" data-id="${c.id}" data-i="${b.i}">${ico('check')} I saved it</button>`}; }
  const ns = act.flatMap(c => stats(c).dueNow.map(b => ({c, b}))).find(x => TYPES[x.c.type].noMoney && x.b.due === TODAY());
  if (ns) return {e:'🛍️', t:'Today is a no-spend day', s:'Only spend on things you really need. Tick it tonight if you made it.', btn:`<button class="btn gold" data-act="tick" data-id="${ns.c.id}" data-i="${ns.b.i}">${ico('check')} I made it</button>`};
  const env = act.find(c => !everyOf(c) && !TYPES[c.type].noMoney);
  if (env) return {e:'✉️', t:'Pick an envelope for today', s:`${stats(env).n - stats(env).doneN} envelopes left in ${esc(env.name)}. Let the app pick one for you.`, btn:`<button class="btn gold" data-act="draw" data-id="${env.id}">${ico('dice')} Draw an envelope</button>`};
  const miss = act.flatMap(c => stats(c).missed);
  if (miss.length) return {e:'💪', t:`Catch up on ${miss.length} earlier step${miss.length>1?'s':''}`, s:'No stress. They count whenever you do them.', btn:`<button class="btn gold" data-act="catchList">Catch up</button>`};
  const notMoved = totals().notMoved; if (notMoved > 0) return {e:'🏦', t:`Put ${money(notMoved)} in your savings account`, s:'Money in your everyday account is easy to spend by mistake.', btn:`<button class="btn gold" data-act="movedAll">Done, I moved it</button>`};
  const pot = S.funds.map(f => ({f, i:fundInfo(f)})).filter(x => !x.i.ready).sort((a,b) => a.i.next < b.i.next ? -1 : 1)[0];
  if (pot) return {e:fEmo(pot.f), t:`Add ${money(pot.i.perMonth,0)} to ${esc(pot.f.name)}`, s:`It is due ${longD(pot.i.next)}. Saving a little each month means no surprise.`, btn:`<button class="btn gold" data-act="addSaving" data-to="f:${pot.f.id}">${ico('plus')} Add money</button>`};
  if (!S.challenges.length) return {e:'🚀', t:'Start your first challenge', s:'Tell us what you can save each week and we will pick one that fits.', btn:`<button class="btn gold" data-act="pickForMe">${ico('spark')} Pick one for me</button>`};
  return {e:'😌', t:'All done for this week', s:'Nothing is due right now. Enjoy your week.', btn:`<button class="btn" data-act="addSaving">${ico('plus')} Add extra money</button>`};
}

function libCard(k){ const T = TYPES[k]; const c = {type:k, base:T.base, count:T.n, style:'up', every:T.every, start:TODAY(), ticks:{}}; const s = stats(c);
  return `<div class="card lib"><div class="emo lg">${EMO[k]}</div><b>${T.name}</b><div class="small muted">${T.desc}</div>
    <div class="tiny" style="margin-top:auto;padding-top:10px">${T.noMoney ? '30 days · builds a habit, no money needed' : T.custom ? 'You choose the rules' : `The classic version saves <b>${S.cur}${s.total.toLocaleString()}</b>`}</div>
    <button class="btn gold sm" style="margin-top:10px" data-act="newChallenge" data-type="${k}">Start this</button></div>`; }
function progressChart(c, s){
  if (TYPES[c.type].noMoney || !everyOf(c) || !s.B.length) return '';
  const t = TODAY(), plan = [], real = []; let p = 0, r = 0; const byDate = {};
  Object.keys(c.ticks).forEach(i => { byDate[c.ticks[i]] = (byDate[c.ticks[i]]||0) + amountOf(c, +i); });
  const dates = Object.keys(byDate).sort();
  s.B.forEach((b, i) => { p += b.amt; plan.push([i, p]); if (b.due <= t) { const nextDue = s.B[i+1] ? s.B[i+1].due : addD(b.due, everyOf(c)); r = dates.filter(d => d < nextDue).reduce((a,d) => a + byDate[d], 0); real.push([i, r]); } });
  const step = Math.max(1, Math.round(s.n / (innerWidth < 700 ? 4 : 6)));
  return `<div class="card" style="margin-bottom:18px"><h3>Your progress <span class="tiny muted" style="letter-spacing:0;text-transform:none">plan vs what you saved</span></h3>
    ${lineChart([{pts:plan, c:'var(--muted)', w:2, dash:true}, {pts:real.length ? real : [[0,0]], c:'var(--gold)', fill:true, w:3}], {labels:s.B.filter((b,i) => i % step === 0).map(b => [b.i, short(b.due)])})}
    <div class="legend"><span><i style="background:var(--gold)"></i>What you saved</span><span><i style="background:var(--muted)"></i>The plan</span></div></div>`;
}
function vChallenge(){

  const s = stats(c), T = TYPES[c.type], g = S.goals.find(x => x.id === c.goalId), notMoved = Math.max(0, s.saved - (c.moved||0)), big = s.n > 120, left = s.n - s.doneN;

    <div class="card kpi"><div class="k">💪 To catch up</div><div class="v ${s.missed.length?'':'green-t'}">${s.missed.length}</div><div class="tiny muted">${s.missed.length ? (T.noMoney ? 'earlier days' : money(s.missed.reduce((a,b) => a + b.amt, 0))+' in total') : 'all caught up'}</div></div>

      return `<button class="bx ${b.done?'d':''} ${miss?'m':''} ${now?'n':''} ${focusBox===b.i?'pulse':''}" data-act="tick" data-id="${c.id}" data-i="${b.i}" title="${chLabel(c,b)}${b.due?' · '+nice(b.due):''}${b.done?' · saved '+short(b.done):''}">

/* ---------- calendar reminders ---------- */
function makeICS(onlyId){
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SheetsInGold//Savings Challenge//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Savings'];
  const d8 = s => s.replace(/-/g,''), now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z', clip = s => String(s).replace(/[,;\\\n]/g,' ');
  const ev = (u, start, title, rrule) => { L.push('BEGIN:VEVENT','UID:'+u+'@sheetsingold-savings','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+d8(start),'DTEND;VALUE=DATE:'+d8(addD(start,1)),'SUMMARY:'+clip(title)); if (rrule) L.push('RRULE:'+rrule);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+clip(title),'TRIGGER:-PT15H','END:VALARM','END:VEVENT'); };
  const t = TODAY();
  S.challenges.filter(c => !onlyId || c.id === onlyId).forEach(c => { const e = everyOf(c); if (!e) return; const left = boxes(c).filter(b => !b.done && b.due >= t); if (!left.length) return;
    const rr = e === 1 ? 'FREQ=DAILY' : e === 7 ? 'FREQ=WEEKLY' : e === 14 ? 'FREQ=WEEKLY;INTERVAL=2' : 'FREQ=MONTHLY';
    ev(c.id, left[0].due, 'Savings: ' + c.name + (TYPES[c.type].noMoney ? ' (no-spend day)' : ''), rr + ';COUNT=' + (c.count - left[0].i)); });
  if (!onlyId) S.funds.forEach(f => ev('f'+f.id, fundNext(f), 'Sinking fund due: ' + f.name + ' ' + S.cur + (+f.cost).toFixed(2), f.every ? 'FREQ=MONTHLY;INTERVAL=' + f.every : null));
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
